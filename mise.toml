[tools]
helm = "3.21.3"

[tasks."validate:scripts"]
description = "Check local support script syntax"
run = '''
for script in scripts/*.sh; do
  bash -n "$script"
done
ruby -c scripts/manage-kind-hosts.rb >/dev/null
ruby scripts/manage-kind-hosts_test.rb
'''

[tasks."validate:cert-manager-config"]
description = "Render the local cert-manager issuer and certificate config"
run = "kubectl kustomize platform/cert-manager-config >/dev/null"

[tasks."validate:argocd-kind-bootstrap"]
description = "Render the kind Argo CD bootstrap resources"
run = '''
kubectl kustomize bootstrap/argocd/kind >/dev/null
kubectl kustomize platform/argocd/config >/dev/null
'''

[tasks."validate:argocd-repositories"]
description = "Render Argo CD repository registrations"
run = "kubectl kustomize platform/argocd/repositories >/dev/null"

[tasks."validate:argocd-config"]
description = "Render steady-state Argo CD server configuration"
run = "kubectl kustomize platform/argocd/config >/dev/null"

[tasks."validate:minio"]
description = "Render the MinIO wrapper Helm chart"
run = '''
helm dependency update platform/minio >/dev/null
helm template minio platform/minio \
  --namespace minio \
  >/tmp/opencode/minio-rendered.yaml
ruby -ryaml -e '
  docs = YAML.load_stream(File.read("/tmp/opencode/minio-rendered.yaml")).compact
  certificate = docs.find { |doc| doc["kind"] == "Certificate" && doc.dig("metadata", "name") == "minio-server" }
  service = docs.find { |doc| doc["kind"] == "Service" && doc.dig("metadata", "name") == "minio" }
  deployment = docs.find { |doc| doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "minio" }
  port = service.fetch("spec").fetch("ports").find { |item| item["name"] == "https" }
  cert_volume = deployment.dig("spec", "template", "spec", "volumes").find { |volume| volume["name"] == "cert-secret-volume" }
  abort "MinIO server Certificate is missing" unless certificate.dig("spec", "secretName") == "minio-tls"
  abort "MinIO Service must expose HTTPS 443 to target 9000" unless port["port"] == 443 && port["targetPort"] == 9000
  abort "MinIO Deployment does not mount minio-tls" unless cert_volume.dig("secret", "secretName") == "minio-tls"
'
'''

[tasks."validate:observability-object-storage-config"]
description = "Render and validate observability object storage bucket config"
run = '''
kubectl kustomize platform/observability/object-storage-config >/tmp/opencode/observability-object-storage-rendered.yaml
ruby -ryaml -e '
  docs = YAML.load_stream(File.read("/tmp/opencode/observability-object-storage-rendered.yaml")).compact
  job = docs.find { |doc| doc["kind"] == "Job" && doc.dig("metadata", "name") == "observability-object-storage-config" }
  pod_spec = job.dig("spec", "template", "spec")
  command = pod_spec.fetch("containers").first.fetch("command").last
  ca_volume = pod_spec.fetch("volumes").find { |volume| volume["name"] == "minio-ca" }
  abort "Provisioning Job must use MinIO HTTPS without a nonstandard port" unless command.include?("https://minio.minio.svc.cluster.local") && !command.include?("http://minio") && !command.include?(":9000")
  abort "Provisioning Job does not trust minio-tls ca.crt" unless ca_volume.dig("secret", "secretName") == "minio-tls" && ca_volume.dig("secret", "items").any? { |item| item["key"] == "ca.crt" }
'
'''

[tasks."validate:mimir"]
description = "Render and validate the Mimir single-binary manifests"
run = '''
kubectl kustomize platform/observability/mimir >/tmp/opencode/mimir-rendered.yaml
ruby -ryaml -e '
  docs = YAML.load_stream(File.read("/tmp/opencode/mimir-rendered.yaml")).compact
  cm = docs.find { |doc| doc["kind"] == "ConfigMap" && doc.dig("metadata", "name") == "mimir-config" }
  certificate = docs.find { |doc| doc["kind"] == "Certificate" && doc.dig("metadata", "name") == "minio-client-ca" }
  deployment = docs.find { |doc| doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "mimir" }
  config = cm.fetch("data").fetch("mimir.yaml")
  ca_volume = deployment.dig("spec", "template", "spec", "volumes").find { |volume| volume["name"] == "minio-ca" }
  abort "Mimir MinIO CA Certificate is missing" unless certificate.dig("spec", "secretName") == "minio-client-ca"
  abort "Mimir must use verified MinIO HTTPS on port 443" unless config.scan("endpoint: minio.minio.svc.cluster.local:443").length == 3 && config.scan("tls_ca_path: /etc/mimir/minio-ca/ca.crt").length == 3 && !config.include?("insecure: true")
  abort "Mimir does not mount the MinIO CA" unless ca_volume.dig("secret", "secretName") == "minio-client-ca" && ca_volume.dig("secret", "items").any? { |item| item["key"] == "ca.crt" }
  File.write("/tmp/opencode/mimir.yaml", config)
  File.write("/tmp/opencode/runtime.yaml", cm.fetch("data").fetch("runtime.yaml"))
'
docker run --rm \
  -v /tmp/opencode/mimir.yaml:/etc/mimir/mimir.yaml:ro \
  -v /tmp/opencode/runtime.yaml:/etc/mimir/runtime.yaml:ro \
  -e AWS_ACCESS_KEY_ID=test \
  -e AWS_SECRET_ACCESS_KEY=test \
  grafana/mimir:3.1.2 \
  -target=all \
  -config.file=/etc/mimir/mimir.yaml \
  -config.expand-env=true \
  -print.config \
  >/dev/null
'''

[tasks."validate:alloy"]
description = "Render the Alloy wrapper chart and validate its runtime config"
run = '''
helm dependency update platform/observability/alloy >/dev/null
helm template alloy platform/observability/alloy \
  --namespace observability-collectors \
  >/tmp/opencode/alloy-rendered.yaml
ruby -ryaml -e 'docs = YAML.load_stream(File.read("/tmp/opencode/alloy-rendered.yaml")); cm = docs.find { |doc| doc["kind"] == "ConfigMap" && doc.dig("metadata", "name") == "alloy" }; File.write("/tmp/opencode/config.alloy", cm.fetch("data").fetch("config.alloy"))'
docker run --rm \
  -v /tmp/opencode/config.alloy:/etc/alloy/config.alloy:ro \
  grafana/alloy:v1.18.0 \
  validate /etc/alloy/config.alloy
'''

[tasks."validate:grafana"]
description = "Render the Grafana wrapper chart and validate its provisioning"
run = '''
for dashboard in platform/observability/grafana/dashboards/*.json; do
  jq empty "$dashboard"
done
ruby -rjson -e '
  allowed = %w[fixed shades thresholds palette-classic palette-classic-by-name continuous-GrYlRd continuous-RdYlGr continuous-BlYlRd continuous-YlRd continuous-BlPu continuous-YlBl continuous-blues continuous-reds continuous-greens continuous-purples]
  ARGV.each do |path|
    stack = [JSON.parse(File.read(path))]
    until stack.empty?
      value = stack.pop
      if value.is_a?(Hash)
        color = value["color"]
        if color.is_a?(Hash) && color["mode"] && !allowed.include?(color["mode"])
          abort "#{path}: unsupported Grafana color mode #{color["mode"].inspect}"
        end
        stack.concat(value.values)
      elsif value.is_a?(Array)
        stack.concat(value)
      end
    end
  end
' platform/observability/grafana/dashboards/*.json
helm dependency update platform/observability/grafana >/dev/null
helm lint platform/observability/grafana >/dev/null
helm template grafana platform/observability/grafana \
  --namespace observability \
  >/tmp/opencode/grafana-rendered.yaml
ruby -ryaml -rjson -e 'docs = YAML.load_stream(File.read("/tmp/opencode/grafana-rendered.yaml")); service = docs.find { |doc| doc&.dig("kind") == "Service" && doc.dig("metadata", "name") == "grafana" }; abort "Grafana Service is not a ClusterIP" unless service&.dig("spec", "type") == "ClusterIP"; config = docs.select { |doc| doc&.dig("kind") == "ConfigMap" }.flat_map { |doc| doc.fetch("data", {}).values }.join("\n"); abort "Grafana management URL is missing" unless config.include?("https://grafana.k8s-playground.test/"); abort "Mimir datasource tenant header is missing" unless config.include?("X-Scope-OrgID") && config.include?("k8s-playground"); dashboards = docs.find { |doc| doc&.dig("kind") == "ConfigMap" && doc.dig("metadata", "name") == "grafana-platform-dashboards" }; abort "Grafana dashboards are missing" unless dashboards&.fetch("data", {})&.length == 2; dashboards.fetch("data").each_value { |json| JSON.parse(json) }'
'''

[tasks."validate:cert-manager"]
description = "Render the cert-manager wrapper Helm chart"
run = '''
helm dependency update platform/cert-manager >/dev/null
helm template cert-manager platform/cert-manager \
  --namespace cert-manager \
  --include-crds \
  >/dev/null
'''

[tasks."validate:gateway-api-config"]
description = "Render the platform Gateway API config"
run = "kubectl kustomize platform/gateway-api-config >/dev/null"

[tasks."validate:management-gateway-config"]
description = "Render the management Gateway API config"
run = "kubectl kustomize platform/management-gateway-config >/dev/null"

[tasks."validate:k8s-playground-service"]
description = "Render the k8s-playground-service app manifests"
run = "kubectl kustomize apps/k8s-playground-service >/dev/null"

[tasks."validate:istio-base"]
description = "Render the Istio base wrapper Helm chart"
run = '''
helm dependency update platform/istio/base >/dev/null
helm template istio-base platform/istio/base \
  --namespace istio-system \
  >/dev/null
'''

[tasks."validate:istiod"]
description = "Render the istiod wrapper Helm chart"
run = '''
helm dependency update platform/istio/istiod >/dev/null
helm template istiod platform/istio/istiod \
  --namespace istio-system \
  >/dev/null
'''

[tasks."validate:istio-cni"]
description = "Render the Istio CNI wrapper Helm chart"
run = '''
helm dependency update platform/istio/cni >/dev/null
helm template istio-cni platform/istio/cni \
  --namespace istio-system \
  >/dev/null
'''

[tasks."validate:istio-ingressgateway"]
description = "Render the Istio ingress gateway wrapper Helm chart"
run = '''
helm dependency update platform/istio/ingressgateway >/dev/null
helm template istio-ingressgateway platform/istio/ingressgateway \
  --namespace istio-system \
  >/dev/null
'''

[tasks."validate:istio-managementgateway"]
description = "Render the Istio management gateway wrapper Helm chart"
run = '''
helm dependency update platform/istio/managementgateway >/dev/null
helm template istio-managementgateway platform/istio/managementgateway \
  --namespace istio-system \
  >/dev/null
'''

[tasks."validate:all"]
description = "Run all platform-config validation tasks"
run = '''
mise run validate:scripts
mise run validate:argocd-kind-bootstrap
mise run validate:argocd-repositories
mise run validate:argocd-config
mise run validate:minio
mise run validate:observability-object-storage-config
mise run validate:mimir
mise run validate:alloy
mise run validate:grafana
mise run validate:cert-manager
mise run validate:cert-manager-config
mise run validate:gateway-api-config
mise run validate:management-gateway-config
mise run validate:k8s-playground-service
mise run validate:istio-base
mise run validate:istiod
mise run validate:istio-cni
mise run validate:istio-ingressgateway
mise run validate:istio-managementgateway
'''

[tasks."cluster:create"]
description = "Create the kind cluster and bootstrap current platform"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--config <config>" help="kind cluster config path" default="clusters/kind/cluster.yaml"
flag "--metallb-version <metallb-version>" help="MetalLB version" default="v0.14.9"
flag "--network <network>" help="Docker network used by kind" default="kind"
flag "--metallb-namespace <metallb-namespace>" help="MetalLB namespace" default="metallb-system"
flag "--metallb-pool-name <metallb-pool-name>" help="MetalLB IPAddressPool name" default="kind-pool"
'''
run = '''
mise run kind:create --name {{ usage.name }} --config {{ usage.config }}
mise run metallb:bootstrap --name {{ usage.name }} --version {{ usage.metallb_version }} --network {{ usage.network }} --namespace {{ usage.metallb_namespace }} --pool-name {{ usage.metallb_pool_name }}
mise run argocd:install --name {{ usage.name }}
mise run minio:bootstrap-secrets --name {{ usage.name }}
mise run mimir:bootstrap-secrets --name {{ usage.name }}
mise run grafana:bootstrap-secrets --name {{ usage.name }}
mise run argocd:bootstrap-roots --name {{ usage.name }}
mise run istio:wait --name {{ usage.name }}
mise run gateway:wait --name {{ usage.name }}
mise run management-gateway:wait --name {{ usage.name }}
mise run gateway:smoke-test --name {{ usage.name }}
mise run kind:status --name {{ usage.name }}
mise run metallb:status --name {{ usage.name }} --namespace {{ usage.metallb_namespace }}
mise run app:status --name {{ usage.name }}
mise run istio:status --name {{ usage.name }}
mise run gateway:status --name {{ usage.name }}
mise run argocd:status --name {{ usage.name }}
mise run cluster:external-ips --name {{ usage.name }}
if ! mise run cluster:hosts:check --name {{ usage.name }}; then
  echo "Run 'mise run cluster:hosts:sync --name {{ usage.name }}' to update /etc/hosts"
fi
'''

[tasks."cluster:delete"]
description = "Delete the local kind cluster"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
'''
run = "mise run kind:delete --name {{ usage.name }}"

[tasks."minio:bootstrap-secrets"]
description = "Create local-only MinIO Secrets required before Argo sync"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="MinIO namespace" default="minio"
flag "--minio-root-secret <minio-root-secret>" help="MinIO root credentials Secret name" default="minio-root-credentials"
flag "--minio-root-user <minio-root-user>" help="MinIO root username" default="minioadmin"
'''
run = '''
kubectl --context kind-{{ usage.name }} create namespace {{ usage.namespace }} --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -

if kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get secret {{ usage.minio_root_secret }} >/dev/null 2>&1; then
  printf 'Secret %s/%s already exists; leaving it unchanged\n' '{{ usage.namespace }}' '{{ usage.minio_root_secret }}'
  exit 0
fi

password="$(openssl rand -base64 32)"
kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} create secret generic {{ usage.minio_root_secret }} \
  --from-literal=rootUser='{{ usage.minio_root_user }}' \
  --from-literal=rootPassword="$password" \
  --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -
'''

[tasks."mimir:bootstrap-secrets"]
description = "Create dedicated local-only Mimir object storage credentials before Argo sync"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--minio-namespace <minio-namespace>" help="MinIO namespace" default="minio"
flag "--mimir-namespace <mimir-namespace>" help="Mimir namespace" default="observability"
flag "--mimir-secret <mimir-secret>" help="Mimir object storage credentials Secret name" default="mimir-object-storage-credentials"
flag "--mimir-access-key <mimir-access-key>" help="MinIO access key for the Mimir user" default="mimir"
'''
run = '''
kubectl --context kind-{{ usage.name }} create namespace {{ usage.minio_namespace }} --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -
kubectl --context kind-{{ usage.name }} create namespace {{ usage.mimir_namespace }} --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -

access_key='{{ usage.mimir_access_key }}'
secret_key=""

for namespace in {{ usage.mimir_namespace }} {{ usage.minio_namespace }}; do
  if kubectl --context kind-{{ usage.name }} -n "$namespace" get secret {{ usage.mimir_secret }} >/dev/null 2>&1; then
    existing_access_key="$(kubectl --context kind-{{ usage.name }} -n "$namespace" get secret {{ usage.mimir_secret }} -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
    if [ "$existing_access_key" = "$access_key" ]; then
      secret_key="$(kubectl --context kind-{{ usage.name }} -n "$namespace" get secret {{ usage.mimir_secret }} -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
      break
    fi
  fi
done

if [ -z "$secret_key" ]; then
  secret_key="$(openssl rand -base64 32)"
fi

for namespace in {{ usage.minio_namespace }} {{ usage.mimir_namespace }}; do
  kubectl --context kind-{{ usage.name }} -n "$namespace" create secret generic {{ usage.mimir_secret }} \
    --from-literal=AWS_ACCESS_KEY_ID="$access_key" \
    --from-literal=AWS_SECRET_ACCESS_KEY="$secret_key" \
    --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -
done
'''

[tasks."grafana:bootstrap-secrets"]
description = "Create local-only Grafana administrator credentials before Argo sync"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="Grafana namespace" default="observability"
flag "--secret <secret>" help="Grafana administrator Secret name" default="grafana-admin-credentials"
flag "--admin-user <admin-user>" help="Grafana administrator username" default="admin"
'''
run = '''
kubectl --context kind-{{ usage.name }} create namespace {{ usage.namespace }} --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -

if kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get secret {{ usage.secret }} >/dev/null 2>&1; then
  printf 'Secret %s/%s already exists; leaving it unchanged\n' '{{ usage.namespace }}' '{{ usage.secret }}'
  exit 0
fi

password="$(openssl rand -base64 32)"
kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} create secret generic {{ usage.secret }} \
  --from-literal=admin-user='{{ usage.admin_user }}' \
  --from-literal=admin-password="$password" \
  --dry-run=client -o yaml | kubectl --context kind-{{ usage.name }} apply -f -
'''

[tasks."grafana:admin-password"]
description = "Print the local Grafana administrator username and password"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="Grafana namespace" default="observability"
flag "--secret <secret>" help="Grafana administrator Secret name" default="grafana-admin-credentials"
'''
run = '''
user="$(kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get secret {{ usage.secret }} -o jsonpath='{.data.admin-user}' | base64 -d)"
password="$(kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get secret {{ usage.secret }} -o jsonpath='{.data.admin-password}' | base64 -d)"
printf 'Username: %s\nPassword: %s\n' "$user" "$password"
'''

[tasks."grafana:status"]
description = "Show Grafana workload, storage, and Service status"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="Grafana namespace" default="observability"
'''
run = '''
kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get deployment,pods,service,persistentvolumeclaim -l app.kubernetes.io/name=grafana -o wide
'''

[tasks."app:status"]
description = "Show k8s-playground-service status"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="app namespace" default="k8s-playground-service"
flag "--service <service>" help="app service name" default="k8s-playground-service"
'''
run = '''
kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get deployment,pods,service -o wide
kubectl --context kind-{{ usage.name }} -n {{ usage.namespace }} get endpointslice -l kubernetes.io/service-name={{ usage.service }} -o wide
'''

[tasks."argocd:install"]
description = "Install Argo CD into the kind cluster"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="Argo CD namespace" default="argocd"
flag "--version <version>" help="Argo CD version" default="v3.4.4"
flag "--path <path>" help="kustomize path for Argo CD prerequisites" default="bootstrap/argocd/kind"
'''
run = '''
mise run argocd:apply --name {{ usage.name }} --namespace {{ usage.namespace }} --version {{ usage.version }} --path {{ usage.path }}
mise run \
  argocd:wait:application-controller --name {{ usage.name }} --namespace {{ usage.namespace }} ::: \
  argocd:wait:applicationset-controller --name {{ usage.name }} --namespace {{ usage.namespace }} ::: \
  argocd:wait:dex-server --name {{ usage.name }} --namespace {{ usage.namespace }} ::: \
  argocd:wait:notifications-controller --name {{ usage.name }} --namespace {{ usage.namespace }} ::: \
  argocd:wait:redis --name {{ usage.name }} --namespace {{ usage.namespace }} ::: \
  argocd:wait:repo-server --name {{ usage.name }} --namespace {{ usage.namespace }} ::: \
  argocd:wait:server --name {{ usage.name }} --namespace {{ usage.namespace }}
echo "Argo CD {{ usage.version }} is ready in namespace {{ usage.namespace }}"
'''

[tasks."argocd:apply"]
hide = true
description = "Apply Argo CD manifests"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--namespace <namespace>" help="Argo CD namespace" default="argocd"
flag "--version <version>" help="Argo CD version" default="v3.4.4"
flag "--path <path>" help="kustomize path for Argo CD prerequisites" default="bootstrap/argocd/kind"
'''
run = '''
kubectl --context kind-{{ usage.name }} apply -k {{ usage.path }}
kubectl --context kind-{{ usage.name }} apply -k platform/argocd/config
kubectl --context kind-{{ usage.name }} apply --server-side --force-conflicts -n {{ usage.namespace }} -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ usage.version }}/manifests/install.yaml
kubectl --context kind-{{ usage.name }} apply -k platform/argocd/config
'''

[tasks."cluster:external-ips"]
description = "List externally reachable platform endpoints"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
'''
run = '''
context="kind-{{ usage.name }}"

print_endpoint() {
  endpoint="$1"
  namespace="$2"
  service="$3"
  url="$4"

  if ! ip="$(kubectl --context "$context" -n "$namespace" get service/"$service" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)"; then
    ip="<missing>"
    url="-"
  elif [ -z "$ip" ]; then
    ip="<pending>"
    url="-"
  fi

  printf '%-22s %-40s %-18s %s\n' "$endpoint" "$namespace/$service" "$ip" "$url"
}

printf '%-22s %-40s %-18s %s\n' "ENDPOINT" "SERVICE" "EXTERNAL IP" "URL"
print_endpoint "Playground service" "istio-system" "istio-ingressgateway" "https://app.k8s-playground.test"
print_endpoint "Argo CD" "istio-system" "istio-managementgateway" "https://argocd.k8s-playground.test"
print_endpoint "Grafana" "istio-system" "istio-managementgateway" "https://grafana.k8s-playground.test"
'''

[tasks."cluster:hosts:check"]
description = "Check managed kind hostname mappings against live Gateway IPs"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--hosts-file <hosts-file>" help="hosts file to inspect" default="/etc/hosts"
'''
run = '''
scripts/manage-kind-hosts.rb check \
  --context kind-{{ usage.name }} \
  --hosts-file "{{ usage.hosts_file }}"
'''

[tasks."cluster:hosts:sync"]
description = "Safely synchronize kind Gateway hostnames in /etc/hosts"
usage = '''
flag "--name <name>" help="kind cluster name" default="k8s-playground"
flag "--hosts-file <hosts-file>" help="hosts file to update" default="/etc/hosts"
'''
run = '''
hosts_file="{{ usage.hosts_file }}"
if [ -L "$hosts_file" ]; then
  echo "$hosts_file is a symbolic link; refusing to replace it" >&2
  exit 1
fi

rendered="$(mktemp)"
trap 'rm -f "$rendered"' EXIT
scripts/manage-kind-hosts.rb render \
  --context kind-{{ usage.name }} \
  --hosts-file "$hosts_file" \
  >"$rendered"

if cmp --silent "$hosts_file" "$rendered"; then
  echo "$hosts_file is already current"
else
  diff --unified "$hosts_file" "$rendered" || true
  backup="${hosts_file}.k8s-playground.backup"
  if [ -L "$backup" ]; then
    echo "$backup is a symbolic link; refusing to replace it" >&2
    exit 1
  fi
  if [ -w "$hosts_file" ]; then
    cp --archive "$hosts_file" "$backup"
    cp "$rendered" "$hosts_file"
  else
    sudo cp --archive "$hosts_file" "$backup"
    sudo cp "$rendered" "$hosts_file"
  fi
fi

if [ "$hosts_file" = "/etc/hosts" ] && command -v resolvectl >/dev/null 2>&1; then
  sudo resolvectl flush-caches
fi

scripts/manage-kind-hosts.rb check \
  --context kind-{{ usage.name }} \
  --hosts-file "$hosts_file"
'''

[tasks."cluster:hosts:remove"]
description = "Remove only the managed kind hostname block from /etc/hosts"
usage = '''
flag "--hosts-file <hosts-file>" help="hosts file to update" default="/etc/hosts"
'''
run = '''
hosts_file="{{ usage.hosts_file }}"
if [ -L "$hosts_file" ]; then
  echo "$hosts_file is a symbolic link; refusing to replace it" >&2
  exit 1
fi

rendered="$(mktemp)"
trap 'rm -f "$rendered"' EXIT
scripts/manage-kind-hosts.rb remove --hosts-file "$hosts_file" >"$rendered"

if cmp --silent "$hosts_file" "$rendered"; then
  echo "$hosts_file does not contain a managed kind hostname block"
else
  diff --unified "$hosts_file" "$rendered" || true
  backup="${hosts_file}.k8s-playground.backup"
  if [ -L "$backup" ]; then
    echo "$backup is a symbolic link; refusing to replace it" >&2
    exit 1
  fi
  if [ -w "$hosts_file" ]; then
    cp --archive "$hosts_file" "$backup"
    cp "$rendered" "$hosts_file"
  else
    sudo cp --archive "$hosts_file" "$backup"
    sudo cp "$rendered" "$hosts_file"
  fi
fi

if [ "$hosts_file" = "/etc/hosts" ] && command -v resolvectl >/dev/null 2>&1; then
  sudo resolvectl flush-caches
fi
'''

