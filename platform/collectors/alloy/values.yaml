alloy:
  crds:
    create: false

  alloy:
    configMap:
      content: |
        discovery.kubernetes "local_node" {
          role = "node"

          selectors {
            role  = "node"
            field = "metadata.name=" + sys.env("NODE_NAME")
          }
        }

        prometheus.remote_write "mimir" {
          external_labels = {
            cluster = "k8s-playground",
          }

          endpoint {
            url = "http://mimir.observability.svc.cluster.local:8080/api/v1/push"

            headers = {
              "X-Scope-OrgID" = "k8s-playground",
            }
          }
        }

        otelcol.receiver.otlp "application" {
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            metrics = [otelcol.processor.memory_limiter.application.input]
          }
        }

        otelcol.processor.memory_limiter "application" {
          check_interval = "1s"
          limit          = "384MiB"
          spike_limit    = "64MiB"

          output {
            metrics = [otelcol.processor.batch.application.input]
          }
        }

        otelcol.processor.batch "application" {
          timeout             = "1s"
          send_batch_size     = 1000
          send_batch_max_size = 2000

          output {
            metrics = [otelcol.exporter.otlphttp.mimir.input]
          }
        }

        otelcol.exporter.otlphttp "mimir" {
          client {
            endpoint = "http://mimir.observability.svc.cluster.local:8080/otlp"

            headers = {
              "X-Scope-OrgID" = "k8s-playground",
            }

            tls {
              insecure = true
            }
          }
        }

        prometheus.scrape "kubelet" {
          targets           = discovery.kubernetes.local_node.targets
          forward_to        = [prometheus.remote_write.mimir.receiver]
          job_name          = "kubelet"
          scheme            = "https"
          metrics_path      = "/metrics"
          scrape_interval   = "30s"
          scrape_timeout    = "10s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            ca_file     = "/var/run/kubelet-pki/kubelet.crt"
            server_name = sys.env("NODE_NAME")
          }
        }

        prometheus.scrape "cadvisor" {
          targets           = discovery.kubernetes.local_node.targets
          forward_to        = [prometheus.remote_write.mimir.receiver]
          job_name          = "cadvisor"
          scheme            = "https"
          metrics_path      = "/metrics/cadvisor"
          scrape_interval   = "30s"
          scrape_timeout    = "10s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            ca_file     = "/var/run/kubelet-pki/kubelet.crt"
            server_name = sys.env("NODE_NAME")
          }
        }

    enableReporting: false
    storagePath: /var/lib/alloy
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
        appProtocol: http
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    mounts:
      extra:
        - name: storage
          mountPath: /var/lib/alloy
        - name: kubelet-serving-ca
          mountPath: /var/run/kubelet-pki/kubelet.crt
          readOnly: true

  configReloader:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true

  controller:
    type: daemonset
    podAnnotations:
      sidecar.istio.io/inject: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    volumes:
      extra:
        - name: storage
          emptyDir: {}
        - name: kubelet-serving-ca
          hostPath:
            path: /var/lib/kubelet/pki/kubelet.crt
            type: File

  global:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 473
      runAsGroup: 473
      fsGroup: 473
      seccompProfile:
        type: RuntimeDefault

  rbac:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - nodes
        verbs:
          - get
          - list
          - watch
    clusterRules:
      - apiGroups:
          - ""
        resources:
          - nodes/metrics
        verbs:
          - get

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  service:
    enabled: true
    type: ClusterIP

  serviceMonitor:
    enabled: false
