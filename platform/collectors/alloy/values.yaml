alloy:
  crds:
    create: false

  alloy:
    configMap:
      content: |
        discovery.kubernetes "local_node" {
          role = "node"

          selectors {
            role  = "node"
            field = "metadata.name=" + sys.env("NODE_NAME")
          }
        }

        prometheus.remote_write "mimir" {
          external_labels = {
            cluster = "k8s-playground",
          }

          endpoint {
            url = "https://mimir.observability.svc.cluster.local/api/v1/push"
            remote_timeout = "10s"

            tls_config {
              ca_file     = "/var/run/mimir-tls/ca.crt"
              cert_file   = "/var/run/mimir-tls/tls.crt"
              key_file    = "/var/run/mimir-tls/tls.key"
              server_name = "mimir.observability.svc.cluster.local"
              min_version = "TLS12"
            }

            queue_config {
              min_backoff      = "500ms"
              max_backoff      = "10s"
              sample_age_limit = "15m"
            }
          }
        }

        otelcol.receiver.otlp "application" {
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            metrics = [otelcol.processor.memory_limiter.application.input]
            traces  = [otelcol.processor.memory_limiter.application.input]
          }
        }

        otelcol.processor.memory_limiter "application" {
          check_interval = "1s"
          limit          = "384MiB"
          spike_limit    = "64MiB"

          output {
            metrics = [otelcol.processor.batch.application.input]
            traces  = [otelcol.processor.batch.application_traces.input]
          }
        }

        otelcol.processor.batch "application" {
          timeout             = "1s"
          send_batch_size     = 1000
          send_batch_max_size = 2000

          output {
            metrics = [otelcol.exporter.otlphttp.mimir.input]
          }
        }

        otelcol.processor.batch "application_traces" {
          timeout             = "1s"
          send_batch_size     = 512
          send_batch_max_size = 1024

          output {
            traces = [otelcol.exporter.otlphttp.tempo.input]
          }
        }

        otelcol.exporter.otlphttp "mimir" {
          client {
            endpoint = "https://mimir.observability.svc.cluster.local/otlp"

            tls {
              ca_file         = "/var/run/mimir-tls/ca.crt"
              cert_file       = "/var/run/mimir-tls/tls.crt"
              key_file        = "/var/run/mimir-tls/tls.key"
              server_name     = "mimir.observability.svc.cluster.local"
              reload_interval = "1m"
            }
          }

          retry_on_failure {
            enabled          = true
            initial_interval = "1s"
            max_interval     = "10s"
            max_elapsed_time = "5m"
          }

          sending_queue {
            enabled           = true
            num_consumers     = 3
            queue_size        = 1000
            block_on_overflow = false
            wait_for_result   = false
          }
        }

        otelcol.exporter.otlphttp "tempo" {
          client {
            endpoint = "https://tempo.observability.svc.cluster.local"
            timeout  = "10s"

            tls {
              ca_file         = "/var/run/tempo-tls/ca.crt"
              cert_file       = "/var/run/tempo-tls/tls.crt"
              key_file        = "/var/run/tempo-tls/tls.key"
              server_name     = "tempo.observability.svc.cluster.local"
              reload_interval = "1m"
            }
          }

          retry_on_failure {
            enabled          = true
            initial_interval = "1s"
            max_interval     = "10s"
            max_elapsed_time = "5m"
          }

          sending_queue {
            enabled           = true
            num_consumers     = 2
            queue_size        = 16777216
            sizer             = "bytes"
            block_on_overflow = false
            wait_for_result   = false
          }
        }

        prometheus.scrape "kubelet" {
          targets           = discovery.kubernetes.local_node.targets
          forward_to        = [prometheus.remote_write.mimir.receiver]
          job_name          = "kubelet"
          scheme            = "https"
          metrics_path      = "/metrics"
          scrape_interval   = "30s"
          scrape_timeout    = "10s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            ca_file     = "/var/run/kubelet-pki/kubelet.crt"
            server_name = sys.env("NODE_NAME")
          }
        }

        prometheus.scrape "cadvisor" {
          targets           = discovery.kubernetes.local_node.targets
          forward_to        = [prometheus.remote_write.mimir.receiver]
          job_name          = "cadvisor"
          scheme            = "https"
          metrics_path      = "/metrics/cadvisor"
          scrape_interval   = "30s"
          scrape_timeout    = "10s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            ca_file     = "/var/run/kubelet-pki/kubelet.crt"
            server_name = sys.env("NODE_NAME")
          }
        }

    enableReporting: false
    storagePath: /var/lib/alloy
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
        appProtocol: http
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    mounts:
      extra:
        - name: storage
          mountPath: /var/lib/alloy
        - name: kubelet-serving-ca
          mountPath: /var/run/kubelet-pki/kubelet.crt
          readOnly: true
        - name: mimir-client-tls
          mountPath: /var/run/mimir-tls
          readOnly: true
        - name: tempo-client-tls
          mountPath: /var/run/tempo-tls
          readOnly: true

  configReloader:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true

  controller:
    type: daemonset
    podAnnotations:
      sidecar.istio.io/inject: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    volumes:
      extra:
        - name: storage
          emptyDir: {}
        - name: kubelet-serving-ca
          hostPath:
            path: /var/lib/kubelet/pki/kubelet.crt
            type: File
        - name: mimir-client-tls
          secret:
            secretName: alloy-mimir-client-tls
        - name: tempo-client-tls
          secret:
            secretName: alloy-tempo-client-tls

  global:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 473
      runAsGroup: 473
      fsGroup: 473
      seccompProfile:
        type: RuntimeDefault

  rbac:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - nodes
        verbs:
          - get
          - list
          - watch
    clusterRules:
      - apiGroups:
          - ""
        resources:
          - nodes/metrics
        verbs:
          - get

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  service:
    enabled: true
    type: ClusterIP

  serviceMonitor:
    enabled: false
