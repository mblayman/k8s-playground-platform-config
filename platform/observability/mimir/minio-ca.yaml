apiVersion: cert-manager.io/v1
kind: Certificate
# cert-manager includes the issuer CA in this Secret; Mimir mounts only ca.crt.
metadata:
  name: minio-client-ca
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: minio-client-ca
  dnsNames:
    - minio.minio.svc.cluster.local
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
