static_resources:
  listeners:
    - name: ingest_https
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              disable_stateless_session_resumption: true
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/tls/tls.crt
                    private_key:
                      filename: /etc/envoy/tls/tls.key
                    watched_directory:
                      path: /etc/envoy/tls
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/tls/ca.crt
                  watched_directory:
                    path: /etc/envoy/tls
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher:
                        exact: spiffe://k8s-playground/collectors/alloy
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mimir_ingest
                codec_type: AUTO
                route_config:
                  name: mimir_ingest
                  virtual_hosts:
                    - name: mimir_ingest
                      domains:
                        - "*"
                      request_headers_to_add:
                        - header:
                            key: X-Scope-OrgID
                            value: k8s-playground
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match:
                            path: /api/v1/push
                          route:
                            cluster: mimir_internal
                            timeout: 30s
                        - match:
                            path: /otlp/v1/metrics
                          route:
                            cluster: mimir_internal
                            timeout: 30s
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: health
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: health
                route_config:
                  name: health
                  virtual_hosts:
                    - name: health
                      domains:
                        - "*"
                      routes:
                        - match:
                            path: /ready
                          direct_response:
                            status: 200
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: mimir_internal
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: mimir_internal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mimir-internal.observability.svc.cluster.local
                      port_value: 8080
