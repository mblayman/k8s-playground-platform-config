resources:
  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: alloy_client_validation
    validation_context:
      trusted_ca:
        filename: /etc/envoy/tls/ca.crt
      watched_directory:
        path: /etc/envoy/tls
      match_typed_subject_alt_names:
        - san_type: URI
          matcher:
            exact: spiffe://k8s-playground/collectors/alloy
