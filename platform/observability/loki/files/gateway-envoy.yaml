node:
  id: loki-gateway
  cluster: loki-gateway
static_resources:
  listeners:
    - name: ingest_https
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              disable_stateless_session_resumption: true
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                tls_certificate_sds_secret_configs:
                  - name: loki_gateway_certificate
                    sds_config:
                      path_config_source:
                        path: /etc/envoy/server-certificate-sds.yaml
                validation_context_sds_secret_config:
                  name: alloy_client_validation
                  sds_config:
                    path_config_source:
                      path: /etc/envoy/client-validation-sds.yaml
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: loki_ingest
                codec_type: AUTO
                route_config:
                  name: loki_ingest
                  virtual_hosts:
                    - name: loki_ingest
                      domains:
                        - "*"
                      request_headers_to_add:
                        - header:
                            key: X-Scope-OrgID
                            value: k8s-playground
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match:
                            path: /loki/api/v1/push
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: POST
                          route:
                            cluster: loki_internal
                            timeout: 30s
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: health
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: health
                route_config:
                  name: health
                  virtual_hosts:
                    - name: health
                      domains:
                        - "*"
                      routes:
                        - match:
                            path: /ready
                          direct_response:
                            status: 200
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: loki_internal
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: loki_internal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: loki-internal.observability.svc.cluster.local
                      port_value: 3100
overload_manager:
  refresh_interval: 0.250s
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 1024
