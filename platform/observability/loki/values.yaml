loki:
  fullnameOverride: loki-internal
  deploymentMode: Monolithic

  defaults:
    automountServiceAccountToken: false

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  rbac:
    namespaced: true

  loki:
    auth_enabled: true
    analytics:
      reporting_enabled: false
    tracing:
      enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      s3:
        endpoint: minio.minio.svc.cluster.local:443
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
        signatureVersion: v4
        s3ForcePathStyle: true
        insecure: false
        http_config:
          ca_file: /etc/loki/minio-ca/ca.crt
    limits_config:
      allow_structured_metadata: true
      retention_period: 24h
      volume_enabled: true
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  singleBinary:
    replicas: 1
    sidecar: false
    podDisruptionBudget:
      enabled: false
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-object-storage-credentials
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-object-storage-credentials
            key: AWS_SECRET_ACCESS_KEY
    extraVolumeMounts:
      - name: minio-ca
        mountPath: /etc/loki/minio-ca
        readOnly: true
    extraVolumes:
      - name: minio-ca
        secret:
          secretName: loki-minio-client-ca
          items:
            - key: ca.crt
              path: ca.crt
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    persistence:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
      enableStatefulSetAutoDeletePVC: false
      storageClass: standard
      accessModes:
        - ReadWriteOnce
      size: 5Gi

  podDisruptionBudget:
    enabled: false

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  distributor:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  indexGateway:
    replicas: 0
  compactor:
    replicas: 0
  ruler:
    enabled: true
    replicas: 0
  bloomGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0

  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  memcached:
    enabled: false
  sidecar:
    rules:
      enabled: false
  minio:
    enabled: false
  rollout_operator:
    enabled: false
  monitoring:
    dashboards:
      enabled: false
    rules:
      enabled: false
    alerts:
      enabled: false
    serviceMonitor:
      enabled: false
