apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tempo-minio-client-ca
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: k8s-playground
spec:
  secretName: tempo-minio-client-ca
  dnsNames:
    - minio.minio.svc.cluster.local
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
