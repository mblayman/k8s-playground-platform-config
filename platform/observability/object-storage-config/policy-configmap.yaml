apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-object-storage-policies
data:
  mimir.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::mimir-blocks",
            "arn:aws:s3:::mimir-ruler",
            "arn:aws:s3:::mimir-alertmanager"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:AbortMultipartUpload",
            "s3:DeleteObject",
            "s3:GetObject",
            "s3:ListMultipartUploadParts",
            "s3:PutObject"
          ],
          "Resource": [
            "arn:aws:s3:::mimir-blocks/*",
            "arn:aws:s3:::mimir-ruler/*",
            "arn:aws:s3:::mimir-alertmanager/*"
          ]
        }
      ]
    }
