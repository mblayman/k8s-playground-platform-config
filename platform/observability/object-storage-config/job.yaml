apiVersion: batch/v1
kind: Job
metadata:
  name: observability-object-storage-config
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: configure-buckets
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
            - name: MIMIR_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-object-storage-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: MIMIR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-object-storage-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: TEMPO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tempo-object-storage-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: TEMPO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tempo-object-storage-credentials
                  key: AWS_SECRET_ACCESS_KEY
          command:
            - /bin/sh
            - -ec
            - |
              until mc --config-dir /tmp/mc alias set local https://minio.minio.svc.cluster.local "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 5
              done

              for bucket in mimir-blocks mimir-ruler mimir-alertmanager loki tempo pyroscope; do
                mc --config-dir /tmp/mc mb --ignore-existing "local/${bucket}"
              done

              mc --config-dir /tmp/mc admin policy create local mimir-bucket-access /etc/minio-policies/mimir.json
              mc --config-dir /tmp/mc admin user add local "$MIMIR_ACCESS_KEY" "$MIMIR_SECRET_KEY"
              mc --config-dir /tmp/mc admin policy attach local mimir-bucket-access --user "$MIMIR_ACCESS_KEY"

              mc --config-dir /tmp/mc admin policy create local tempo-bucket-access /etc/minio-policies/tempo.json
              mc --config-dir /tmp/mc admin user add local "$TEMPO_ACCESS_KEY" "$TEMPO_SECRET_KEY"
              mc --config-dir /tmp/mc admin policy attach local tempo-bucket-access --user "$TEMPO_ACCESS_KEY"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: policies
              mountPath: /etc/minio-policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: minio-ca
              mountPath: /tmp/mc/certs/CAs
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: observability-object-storage-policies
        - name: tmp
          emptyDir: {}
        - name: minio-ca
          secret:
            secretName: minio-tls
            items:
              - key: ca.crt
                path: minio-ca.crt
