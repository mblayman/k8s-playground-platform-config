apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: k8s-playground
spec:
  hostnames:
    - argocd.k8s-playground.test
  parentRefs:
    - name: k8s-playground-management-gateway
      namespace: istio-system
      sectionName: https
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
