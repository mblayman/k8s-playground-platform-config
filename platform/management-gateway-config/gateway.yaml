apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: k8s-playground-management-gateway
  namespace: istio-system
  labels:
    app.kubernetes.io/name: k8s-playground-management-gateway
    app.kubernetes.io/part-of: k8s-playground
spec:
  gatewayClassName: istio
  addresses:
    - type: Hostname
      value: istio-managementgateway.istio-system.svc.cluster.local
  listeners:
    - name: http
      hostname: "*.k8s-playground.test"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.k8s-playground.test"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: k8s-playground-management-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
